# Publica la web de Calobirra en GitHub Pages (gratis en repositorios públicos).
# Datos públicos del titular en datos.json (NIF y domicilio son opcionales: si faltan, no se publican).
# Settings › Pages › Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Rellenar datos y comprobar
        run: |
          python3 tools/build_web.py --config datos.json --out _site
          python3 tools/check_web.py _site --final
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
